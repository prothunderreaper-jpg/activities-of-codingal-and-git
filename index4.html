<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in html</title>
</head>
<body>
    <h2>Forms in html</h2>
    <form>
        <label>name</label>
        <input type="text">
        <label>number</label>
        <input type="number">
        <label>password</label>
        <input type="password">
        <label>gender</label> <br><br>
        <input type="radio" > male <br><br>
        <input type="radio" > female <br><br>
        <label>Which city you want to go</label> <br><br>
        <input type="checkbox"> Lahore <br>
        <input type="checkbox"> Islamabad <br>
        <input type="checkbox"> quetta <br>
        <input type="checkbox"> Peshawar <br>
        <label>subject</label>
        <select>
            <option>Math</option>
            <option>Computer</option>
            <option>English</option>
            <option>Arabic</option>
        </select>
        
        <input type="submit">
    </form>
    <form>
        <fieldset>
            <legend><h3>Personal Details</h3></legend>
            <label>card details</label>
            <input type="number" name="card details">
            <label>birthday</label>
            <input type="date">
        </fieldset>
    </form>
    <form
    oninput="x.value = (Number(c1.value) + Number(c2.value))/2"
    >
        <fieldset>
            <legend>marks calculation</legend>
            <label>marks</label>
            <select>
                <option>Math</option>
                <option>Computer</option>
                <option>English</option>
                <option>Arabic</option>
            </select>
            <input type="number" id="c1" name="c1">
            <select>
                <option>Math</option>
                <option>Computer</option>
                <option>English</option>
                <option>Arabic</option>
            </select>
            <input type="number" id="c2" name="c2">
            average: <output name="x" for="c1 c2" ></output>

        </fieldset>
    </form>
</body>
</html>
