<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 50px 15px;
        }

        .email-box {
            max-width: 600px;
            margin: auto;
            background-color: rgb(61, 61, 61);
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            color: #0022ff;
            margin-top: 0;
        }

        p {
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 11px 25px;
            border: none;
            border-radius: 5px;
            background-color: #009dff;
            color: #222;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #00e1e5;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #343852;
            text-decoration: none;
        }
        .href{
            color:aqua;
        }
    </style>
</head>
<body>
    <div class="email-box">
        <h1>Send an Email</h1>
        <p>Fill in the form below to send your message.</p>

        <form action="mailto:youremail@example.com" method="post" enctype="text/plain">
            <label for="name">Name</label>
            <input type="text" id="name" name="Name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="Email" required>

            <label for="message">Message</label>
            <textarea id="message" name="Message" required></textarea>

            <button type="submit">Send Email</button>
        </form>

        <a href="project1.html" class="back">Back to Website</a>
    </div>

</body>
</html>
