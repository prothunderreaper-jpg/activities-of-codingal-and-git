<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loops and switches</title>
</head>
<body>
    <style>
        *{
            background-color: rgb(167, 166, 166);
        }
    </style>
    <p id="day"></p>
    <script>
    
        var str="nice to meet you!";
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith("n"));
        var str2="Books"
        document.write(str2.startsWith("B"));
        document.write("<br>");
        document.write(str2.endsWith("s"));        
        document.write("<br>");
        document.write(1);
        document.write("<br>");
        document.write(2);
        document.write("<br>");
        document.write(3);
        document.write("<br>");
        document.write(4);
        document.write("<br>");
        document.write("br");

        if(1>2){
            document.write("1 is greater than 2");
        }
        else{
            document.write("1 is not greater than 2");
        }
        if(5>3){
            document.write("<br>");
            document.write("5 is greater than 3");
        }
        else{
            document.write("<br>");
            document.write("5 is not greater than 3");
        }
        document.write("<br>");
        for(loop=1; loop<=10; loop++){
            document.write("<br>");
            document.write(loop);
        }
        document.write("<br>");
        for(loop=0; loop>=-10; loop--){
            document.write("<br>");
            document.write(loop);
        }

    </script>
</body>
</html>
