<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>activity of css</title>
    <link rel="stylesheet" href="index5.css">
</head>
<style>
    body{
    background-image: linear-gradient(to bottom, #00bfff, #8800ff);
    background-repeat: no-repeat;
    background-position: center;
}
.start{
    animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
    from { background-color: #ff0000; }
    to { background-color: #ffc400; }
}
.title{
    color: #ff7300;
}

</style>
<body>
    <h1>CSS activity web</h1>
    <div class="start" style="font-size: 20px;">
       
            This is a heading div
       
    </div>
    <div class="title">
        <h2>
            This is a title div
        </h2>
    </div>

</body>
</html>
