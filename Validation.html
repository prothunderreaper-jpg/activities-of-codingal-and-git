<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation in JS</title>
    <style>
        body{
            text-align: center;
            margin-top: 50px;
        }
        h1{
            color: rgb(0, 0, 0);
            font-size: 40px;
            font-family: Helvetica, sans-serif;
        }
        input{
            padding: 10px;
            font-size: 15px;
            border-radius: 5px;
            border: 3px solid #050506;
            margin-bottom: 10px;
            font-family: "Trebuchet MS", sans-serif;
            width: 200px;
        }
        script{
            font-family: "Trebuchet MS", sans-serif;
        }
    </style>
</head>
<body>
    <h1>Guess the Number</h1>
    <p>Enter a number between 1 and 5:</p>
    <input type="text" id="name" placeholder="Enter your name">
    <p id="msg-name"></p>
    <input type="number" id="guess" placeholder="Enter your guess( 1 - 5 )" min="1" max="5">
    <p id="msg-guess"></p>
    <button onclick="checkForm()">Check Guess</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>
        var seconds=0;
        setInterval(function(){
            seconds=seconds + 1;
            document.getElementById("timer").innerHTML = "you have been here for " + seconds + " seconds";
        }, 1000);
            
            function checkForm(){
                var name=document.getElementById("name").value;
                var guess=document.getElementById("guess").value;
                var ok=true;
                if (name == ""){
                    document.getElementById("msg-name").textContent = "Name is required";
                    document.getElementById("msg-name").style.color = "red";
                    ok=false;
                }
                else {
                    document.getElementById("msg-name").textContent = "Great name!";
                    document.getElementById("msg-name").style.color = "green";
                }
                if (guess == ""){
                    document.getElementById("msg-guess").textContent = "Guess is required";
                    document.getElementById("msg-guess").style.color = "red";
                    ok=false;
                }
                else {
                    document.getElementById("msg-guess").textContent = "Guess saved!";
                    document.getElementById("msg-guess").style.color = "green";
                }
                if (ok==true){
                    var lucky = Math.floor(Math.random() * 5) + 1;
                    if (guess == lucky){
                        document.getElementById("result").textContent = "you win, " + name + " The lucky number was " + lucky;
                        document.getElementById("result").style.color = "green";
                    }
                    else {
                        document.getElementById("result").textContent = "you lose, " + name + " The lucky number was " + lucky;
                        document.getElementById("result").style.color = "navy";
                    }
                }
            }

        
        
    </script>

</body>
</html>
