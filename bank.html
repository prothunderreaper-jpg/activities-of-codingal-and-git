<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bank App</title>
    <style>
        h1{
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }
    </style>

</head>
<body>

    <div id="app">

        <h1 id="app-title">My Bank</h1>

        <div id="balance-box">
            <div id="balance-label">Available balance</div>
            <div id="balance">10000</div>
        </div>
        <br>
        <div id="entry-box">
            <label id="amount-label" for="amount">Enter amount</label>
            <input type="number" id="amount">
        </div>
        <br>
        <div id="button-box">
            <button class="action credit" id="credit-btn">Credit</button>
            <button class="action debit" id="debit-btn">Debit</button>
        </div>
        <br>
        <div id="note">Enter an amount and choose an action</div>

    </div>

</body>
</html>
