<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bank App</title>
    <style>
        h1{
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #000000;
        }

        #app {
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            background-color: rgb(49, 47, 91);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgb(250, 249, 249);
        }

        #app-title {
            text-align: center;
            margin-top: 0;
            color: #ffd500;
        }

        #balance-box {
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            background-color: #e7caff;
            border-radius: 8px;
        }

        #balance-label {
            font-size: 16px;
            color: #555;
        }

        #balance {
            margin-top: 8px;
            font-size: 30px;
            font-weight: bold;
            color: #17365d;
        }

        #entry-box {
            margin-bottom: 20px;
        }

        #amount-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        #amount {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }

        #button-box {
            display: flex;
            gap: 10px;
        }

        .action {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .action.credit {
            background-color: #00aaff;
            color: white;
        }

        .action.debit {
            background-color: #ff4d00;
            color: white;
        }

        #note {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #777;
            font-family: 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>

</head>
<body>

    <div id="app">

    <h1 id="app-title"><u>My Bank</u></h1>

        <div id="balance-box">

            <div id="balance-label">Available balance:</div>
            <div id="balance">100000</div>
        
        </div>
        
        <br>
        
        <div id="entry-box">
        
            <label id="amount-label" for="amount">Enter amount</label>
            <input type="number" id="amount">
        
        </div>
        
        <br>
        
        <div id="button-box">
            <button class="action credit" id="credit-btn">Credit</button>
            <button class="action debit" id="debit-btn">Debit</button>
        </div>
        
        <br>
        
        <div id="note">|_Enter an amount and choose an action above_|</div>

    </div>
</body>
</html>
