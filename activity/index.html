<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    h1{
        color: #000000;
    }
    p{
        color: #0053d8;
        background-color: #bdbdbd;
        font-size: 8px;
    }
    .conduct{
        color: #b70000;
    }   
    #live{
        color: #00b700;
        background-color: #d8d800;
        font-size: 25px;
    }
</style>
<body>
    <h2>introduction of css</h2>
    <h1 class="conduct">this is the h1 class</h1>
    <p> css stands for cascading style sheets</p>
    <p style="color: #6d6d6d;"> css is used to style html documents</p>

    <h3 id="live">how to make your website live?</h3>
</body>
</html>
