<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator pt1</title>
    <style>
        h1{
            font-family: "system-ui", 'Helvetica Neue', sans-serif, 'Arial Narrow', Arial, sans-serif;
            text-align: top;
        }
        body{
            text-align: center;
            padding: 50px;
            background-color: rgb(222, 222, 222);
        }
        button{
            padding: 5px;
            border: 2px solid rgb(0,0,0);
            transition: cubic-bezier(0.6, 0.04, 0.98, 0.335);
            margin: 5px;
            height: 55px;
            width: 55px;
            text-size-adjust: 30px;
            border-radius: 10px;
            color: rgb(0, 13, 255);
            background-color: rgb(0, 255, 187);
        }
        input{
            color: blue;
            height: 30px;
            width: 250px;
            
        }
    </style>
<body>
    <h1><u>My Calculator app</u></h1>

    <input type="text" id="display" value="0" readonly>
    <br>
    <button class="Clear" onclick="clearDisplay">C</button>
    <button class="Backspace" onclick="backspace">🔙</button>
    <button class="function">=</button>
    <button class="function">/</button>
    <br>
    <button class="numbers">7</button>
    <button class="numbers">8</button>
    <button class="numbers">9</button>
    <button class="function">+</button>
   
    <br>
    
    <button class="numbers">4</button>
    <button class="numbers">5</button>
    <button class="numbers">6</button>   
    <button class="function">-</button>
   
    <br>
    <button class="numbers">1</button>
    <button class="numbers">2</button>
    <button class="numbers">3</button>
    <button class="function">x</button>
    
    <br>
    
   
    
    
    
</input>
</body>
</html>
