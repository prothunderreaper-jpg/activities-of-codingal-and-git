<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Json and JS Asynchronous</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    *
    h1{
        background-color: linear-gradient(135deg, #7b00ff 50%, #0011ff 100%);
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif, sans-serif;
        background-color: #2d00f8;
        font-style: "trebuchet ms" , sans-serif;
        color: white;
        text-align: center;
    }
    div{
        padding: 10px;
        border: 1px solid #c9c9c9;
        font-family: 'Trebuchet MS', 'Lucida Sans', Arial, sans-serif;
    }
    button{
        
        margin: 10px;
        text-align: center;
        position: center;
        border: 15px;
        padding: 3px;
    }
    
    .gradient-btn {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    border: none;
    color: white;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    transition: opacity 0.3s ease, transform 0.2s ease;
    }

    .gradient-btn:hover {
    opacity: 0.9;
    transform: translateY(-2px);
    }

</style>
</head>
<body>
    <h1>Delivery tracker</h1>
    <button class="gradient-btn" onclick="SaveOrder()">Save Order</button>
    <button class="gradient-btn" onclick="StartDelivery()">Start Delivery</button>
    <div>JSON text: <span id="jsonText"></span></div>
    <div>Loaded Item: <span id="loaded-Item"></span></div>
    <div>Loaded Price: <span id="loaded-Price"></span></div>
    <div>Status: <span id="status"></span></div>
    <div>Result: <span id="result"></span></div>


    <script>
     let order = {
        item:  "Pizza and Coke",
        price: 10,
        shop:  "My Snack Shop"
    };

    function SaveOrder() {
    let jsonText = JSON.stringify(order);
    let loadedOrder = JSON.parse(jsonText); 
    document.getElementById("jsonText").innerHTML = loadedOrder.item + " from " + loadedOrder.shop;

    document.getElementById("loaded-Item").innerHTML = loadedOrder.item;
    document.getElementById("loaded-Price").innerHTML = "$" + loadedOrder.price;
    }
    
    function Delay(ms) {
        return new Promise(function(resolve) {
            setTimeout(resolve, ms);
        });
    }
    async function StartDelivery() {
        document.getElementById("result").innerHTML = " Order is being processed";
      
        document.getElementById("status").innerHTML = "Delivered";
        document.getElementById("status").innerHTML = "Order received";
        await Delay(1000);
        document.getElementById("status").innerHTML = "order is preparing";
        await Delay(3000);
        document.getElementById("status").innerHTML = "order is on the way";
        await Delay(2000);
        document.getElementById("result").innerHTML = "order is delivered";
    }

</script>
</body>
</html>
