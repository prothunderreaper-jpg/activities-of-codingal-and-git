<!DOCTYPE html>
<html>
<head>
  <title>School Event Data</title>
 
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #6f00ff;
      text-align: center;
    }
 
    .event-card {
      width: 520px;
      background-color: rgb(214, 214, 214);
      border: 3px solid #0004ff;
      border-radius: 18px;
      margin: 40px auto;
      padding: 25px;
      box-shadow: 0 0 18px #3593ff;
    }
 
    h1 {
      color: #1d4ed8;
    }
    
    .gradient-btn {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    border: none;
    color: white;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    transition: opacity 0.3s ease, transform 0.2s ease;
    }

    .gradient-btn:hover {
    opacity: 0.9;
    transform: translateY(-2px);
    }
 
    .info-box {
      background-color: #eff6ff;
      border: 2px dashed #60a5fa;
      border-radius: 12px;
      margin-top: 18px;
      padding: 15px;
      text-align: left;
      line-height: 1.7;
    }
 
    #status {
      color: #20c4da;
      font-weight: bold;
      font-size: 18px;
    }
 
    #jsonOutput {
      color: #ff4000;
      font-size: 14px;
      word-wrap: break-word;
    }
  </style>
</head>
 
<body>
 
  <div class="event-card">
 
    <h1>School Event Data</h1>
 
    <p>
      Click the button to load school event details using JSON and asynchronous JavaScript.
    </p>
 
    <button class="gradient-btn" onclick="showSchoolEvent()">Load Event Details</button>
 
    <div class="info-box">
      <h2>Loading Status</h2>
      <p id="status">Waiting to load event data...</p>
    </div>
 
    <div class="info-box">
      <h2>Event Details</h2>
      <p id="eventDetails"></p>
    </div>
 
    <div class="info-box">
      <h2>JSON Text Output</h2>
      <p id="jsonOutput"></p>
    </div>
 
  </div>
 
  <script>

    function showLoadingMessage(message) {
      document.getElementById("status").innerHTML = message;
    }
 
    function fetchSchoolEventData(callback) {
 
      callback("Loading school event data... Please wait.");
 
      return new Promise(function(resolve) {

        setTimeout(function() {
 
          let schoolEvent = {
            EventName: "Annual Science Event",
            date: "15 August 2026",
            time: "9:00 am - 5:00 pm",
            venue: "School Auditorium",
            coordinator: "Head of Science Department",
            participants: 150,
            isRegistrationOpen: true
          };
 
          resolve(schoolEvent);
 
        }, 1800);
      });
    }
 
    async function showSchoolEvent() {
 
      let eventData = await fetchSchoolEventData(showLoadingMessage);
 
      document.getElementById("status").innerHTML = "Event data loaded successfully!";
 
      let jsonText = JSON.stringify(eventData);
 
      let parsedEvent = JSON.parse(jsonText);
 
      let eventMessage = "";
      eventMessage = eventMessage + "Event Name: " + parsedEvent.EventName + "<br>";
      eventMessage = eventMessage + "Date: " + parsedEvent.date + "<br>";
      eventMessage = eventMessage + "Time: " + parsedEvent.time + "<br>";
      eventMessage = eventMessage + "Venue: " + parsedEvent.venue + "<br>";
      eventMessage = eventMessage + "Coordinator: " + parsedEvent.coordinator + "<br>";
      eventMessage = eventMessage + "Participants: " + parsedEvent.participants + "<br>";
 
      if (parsedEvent.isRegistrationOpen === true) {
        eventMessage = eventMessage + "Registration Status: Open";
      } else {
        eventMessage = eventMessage + "Registration Status: Closed";
      }
 
      document.getElementById("eventDetails").innerHTML = eventMessage;
      document.getElementById("jsonOutput").innerHTML = jsonText;
    }
 
  </script>
    
</body>
</html>
